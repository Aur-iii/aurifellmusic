<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contact Auri Fell for general inquiries, commissions, and collaboration opportunities."
    />
    <link rel="canonical" href="https://aurifellmusic.com/contact.html" />
    <meta property="og:site_name" content="Auri Fell Music" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Auri Fell Music - Contact" />
    <meta property="og:url" content="https://aurifellmusic.com/contact.html" />
    <meta
      property="og:image"
      content="https://aurifellmusic.com/assets/images/auri-headshot-square.png"
    />
    <title>Auri Fell Music - Contact</title>
    <meta name="theme-color" content="#070915" />
    <link rel="icon" type="image/png" href="./assets/images/auri-a-color.png" />
    <link rel="stylesheet" href="./assets/css/site.css" />
    <link rel="stylesheet" href="./assets/css/contact.css" />
  </head>
  <body>
    <a class="visually-hidden" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap brand-row">
        <a class="brand" href="index.html" aria-label="Auri Fell Music home"
          ><img class="logo" src="./assets/images/auri-a-color.png" alt="" /><span class="title"
            >Auri Fell Music</span
          ></a
        >
        <nav aria-label="Primary" id="site-nav">
          <a class="nav-link" href="index.html">Home</a
          ><a class="nav-link" href="about.html">About</a
          ><a class="nav-link" href="music.html">Music</a
          ><a class="nav-link" href="blog.html">Blog</a
          ><a class="nav-link active" href="contact.html">Contact</a>
        </nav>
        <button
          class="hamburger"
          id="menuBtn"
          aria-controls="menuCard"
          aria-expanded="false"
          aria-label="Open menu"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <g class="dots">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </g>
            <g class="lines">
              <rect x="3" y="5" width="18" height="2" rx="1" />
              <rect x="3" y="11" width="18" height="2" rx="1" />
              <rect x="3" y="17" width="18" height="2" rx="1" />
            </g>
          </svg>
        </button>
      </div>
    </header>
    <div class="menu-card" id="menuCard" role="dialog" aria-modal="true" aria-label="Menu">
      <nav class="menu-list" aria-label="Mobile">
        <a href="index.html">Home</a><a href="about.html">About</a><a href="music.html">Music</a
        ><a href="blog.html">Blog</a><a class="active" href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <main id="main" class="wrap contact-page">
      <div class="contact-layout">
        <section class="card contact-blurb">
          <span class="eyebrow">Contact</span>
          <h1>Let’s make something.</h1>
          <p>
            For general inquiries, commissions, collaborations, or just a nice note, I’d love to
            hear from you.
          </p>
        </section>
        <section class="card contact-panel">
          <form id="contactForm" class="contact-form" novalidate>
            <label
              >What are you reaching out about?<select id="reason" name="reason" required>
                <option value="General Inquiry" selected>General inquiry</option>
                <option value="Commission">Commission</option>
                <option value="Collaboration">Collaboration</option>
                <option value="Other">Other (custom title)</option>
              </select></label
            ><label
              >Your email<input
                id="email"
                name="reply_to"
                type="email"
                required
                placeholder="you@example.com" /></label
            ><label class="wide" id="customTitleRow" style="display: none"
              >Title<input
                id="customTitle"
                name="title"
                type="text"
                placeholder="Email title" /></label
            ><label class="wide"
              >Your message<textarea
                id="message"
                name="message"
                rows="6"
                required
                placeholder="Tell me a bit about what you have in mind…"
              ></textarea></label
            ><input type="hidden" id="subject" name="subject" value="" /><input
              class="honeypot"
              type="text"
              name="phone"
              id="hp"
              tabindex="-1"
              autocomplete="off"
              aria-hidden="true"
            />
            <p class="form-note">I’ll get back to you as soon as I can.</p>
            <button type="submit" class="button submit">Send message ↗</button>
            <p id="formStatus" role="status"></p>
          </form>
        </section>
      </div>
    </main>
    <footer class="floating">
      <div class="wrap footer-inner">
        <p class="credits">
          © <span id="y"></span> Auri Fell ·
          <a href="mailto:auri@aurifellmusic.com">auri@aurifellmusic.com</a>
        </p>
        <div class="icon-links" aria-label="Social links">
          <a
            href="https://www.youtube.com/@AuriFellMusic"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
            ><svg><use href="./assets/images/social-icons.svg#youtube"></use></svg></a
          ><a
            href="https://aurifell-music.bandcamp.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Bandcamp"
            ><svg><use href="./assets/images/social-icons.svg#bandcamp"></use></svg></a
          ><a
            href="https://www.instagram.com/aurifellmusic/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            ><svg><use href="./assets/images/social-icons.svg#instagram"></use></svg></a
          ><a
            href="https://www.tiktok.com/@aurifellmusic"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
            ><svg><use href="./assets/images/social-icons.svg#tiktok"></use></svg></a
          ><a
            href="https://www.facebook.com/aurifellmusic/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
            ><svg><use href="./assets/images/social-icons.svg#facebook"></use></svg></a
          ><a
            href="https://discord.gg/yuPxHuxY4F"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Discord"
            ><svg><use href="./assets/images/social-icons.svg#discord"></use></svg
          ></a>
        </div>
      </div>
    </footer>
    <script src="./assets/scripts/site.js"></script>
    <script src="./assets/scripts/social-icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
      (() => {
        const form = document.getElementById('contactForm');
        const email = document.getElementById('email');
        const reason = document.getElementById('reason');
        const customRow = document.getElementById('customTitleRow');
        const customTitle = document.getElementById('customTitle');
        const message = document.getElementById('message');
        const subject = document.getElementById('subject');
        const status = document.getElementById('formStatus');
        const honeypot = document.getElementById('hp');
        let statusTimer;
        const showStatus = (text, color, duration = 0) => {
          clearTimeout(statusTimer);
          status.style.color = color;
          status.textContent = text;
          if (duration) {
            statusTimer = setTimeout(() => {
              if (status.textContent === text) status.textContent = '';
            }, duration);
          }
        };
        emailjs.init({ publicKey: 'MLLlLku8J8USwTVeg' });
        const toggleCustom = () => {
          const other = reason.value === 'Other';
          customRow.style.display = other ? '' : 'none';
          customTitle.required = other;
        };
        reason.addEventListener('change', toggleCustom);
        toggleCustom();
        const grow = () => {
          message.style.height = 'auto';
          message.style.height = message.scrollHeight + 'px';
        };
        message.addEventListener('input', grow);
        grow();
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (honeypot.value) return;
          if (!email.checkValidity()) {
            showStatus('Please enter a valid email address.', 'var(--red)', 5000);
            email.reportValidity();
            return;
          }
          if (reason.value === 'Other' && !customTitle.value.trim()) {
            showStatus('Please add a title.', 'var(--yellow)', 5000);
            customTitle.focus();
            return;
          }
          if (!message.value.trim()) {
            showStatus('Please add a message.', 'var(--yellow)');
            return;
          }
          subject.value =
            reason.value === 'Other' ? customTitle.value.trim() : '[' + reason.value + ']';
          showStatus('Sending…', 'var(--muted)');
          try {
            const result = await emailjs.sendForm(
              'service_aurifellmusic',
              'template_aurifellmusic',
              form,
            );
            if (result.status !== 200) throw new Error('EmailJS error');
            showStatus('Message sent! Thank you 💙', 'var(--green)', 5000);
            form.reset();
            toggleCustom();
            grow();
          } catch (error) {
            console.error(error);
            showStatus('Something went wrong. Please try again.', 'var(--red)');
          }
        });
      })();
    </script>
  </body>
</html>
